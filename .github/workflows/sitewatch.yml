name: SiteWatch — vérifications des points d'entrée

# Le plan Vercel Hobby limite les crons (1x/jour) : on pilote donc les vérifications depuis GitHub Actions.
# Toutes les 15 minutes. Chaque vérification n'est lancée que si sa fréquence propre est échue.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sitewatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifications échues
        run: |
          CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 115 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://kah-digital.ch/api/cron/sitewatch" || echo 000)
          echo "sitewatch -> $CODE"; head -c 400 /tmp/r.json; echo
          [ "$CODE" = "200" ] || { echo "::error::SiteWatch KO (HTTP $CODE)"; exit 1; }
          jq -e '.ok == true' /tmp/r.json >/dev/null || { echo "::error::Réponse ok != true"; exit 1; }
