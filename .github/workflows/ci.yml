name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : pas de téléchargement de Chromium (puppeteer), inutile ici.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitaires (ciblage, audit, contrôle d'envoi, coupe-circuit)
        run: npm run test:unit
